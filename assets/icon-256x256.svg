<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0f14"/>
      <stop offset="100%" stop-color="#111520"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#f9731630"/>
    </linearGradient>
    <linearGradient id="bar-dim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9731660"/>
      <stop offset="100%" stop-color="#f9731615"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="256" height="256" rx="48"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- Background -->
    <rect width="256" height="256" fill="url(#bg)"/>
    <rect width="256" height="256" fill="url(#glow)"/>

    <!-- Waveform bars, centred at x=128, y=140 -->
    <!-- 11 bars, spaced 14px apart, mirrored heights -->
    <rect x="51"  y="124" width="9" height="32"  rx="4.5" fill="url(#bar-dim)"/>
    <rect x="65"  y="116" width="9" height="48"  rx="4.5" fill="url(#bar-dim)"/>
    <rect x="79"  y="104" width="9" height="72"  rx="4.5" fill="url(#bar)"/>
    <rect x="93"  y="90"  width="9" height="100" rx="4.5" fill="url(#bar)"/>
    <rect x="107" y="76"  width="9" height="128" rx="4.5" fill="url(#bar)"/>
    <!-- Centre bar (tallest) -->
    <rect x="121" y="64"  width="9" height="152" rx="4.5" fill="#f97316"/>
    <rect x="135" y="76"  width="9" height="128" rx="4.5" fill="url(#bar)"/>
    <rect x="149" y="90"  width="9" height="100" rx="4.5" fill="url(#bar)"/>
    <rect x="163" y="104" width="9" height="72"  rx="4.5" fill="url(#bar)"/>
    <rect x="177" y="116" width="9" height="48"  rx="4.5" fill="url(#bar-dim)"/>
    <rect x="191" y="124" width="9" height="32"  rx="4.5" fill="url(#bar-dim)"/>

    <!-- Playhead dot -->
    <circle cx="125" cy="140" r="6" fill="#f97316"/>
    <circle cx="125" cy="140" r="12" fill="#f97316" fill-opacity="0.2"/>

    <!-- "VT" monogram below waveform -->
    <text x="128" y="228" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="4">VT AUDIO</text>

    <!-- Accent underline -->
    <rect x="78" y="233" width="100" height="2" rx="1" fill="#f97316" opacity="0.7"/>
  </g>
</svg>
